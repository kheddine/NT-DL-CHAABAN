<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser-Based Fraud Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0/dist/tf.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .panel { border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        #trainingProgress { height: 200px; overflow-y: auto; }
        .progress-item { margin: 5px 0; padding: 5px; border-radius: 3px; }
        .progress-item:nth-child(even) { background: #f5f5f5; }
        #resultsCanvas { width: 100%; height: 300px; border: 1px solid #ccc; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        input[type="file"] { margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        .warning { color: orange; }
        
        /* Process Window Styles */
        #processWindow { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 400px; 
            background: white; 
            border: 2px solid #333; 
            border-radius: 10px; 
            padding: 20px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
        }
        #processWindow h3 { margin-top: 0; color: #333; }
        #processContent { 
            height: 200px; 
            overflow-y: auto; 
            border: 1px solid #ddd; 
            padding: 10px; 
            margin: 10px 0;
            background: #f9f9f9;
        }
        .process-step { 
            margin: 8px 0; 
            padding: 5px; 
            border-left: 3px solid #007cba; 
            background: white;
        }
        .process-step.completed { border-left-color: #4CAF50; background: #f0fff0; }
        .process-step.error { border-left-color: #ff5252; background: #fff0f0; }
        .process-step.active { border-left-color: #ff9800; background: #fff9e6; font-weight: bold; }
        #processProgress { 
            width: 100%; 
            height: 20px; 
            background: #f0f0f0; 
            border-radius: 10px; 
            margin: 10px 0;
            overflow: hidden;
        }
        #processProgressBar { 
            height: 100%; 
            background: linear-gradient(90deg, #4CAF50, #45a049); 
            width: 0%; 
            transition: width 0.3s ease;
        }
        #closeProcessWindow { 
            float: right; 
            background: #ff5252; 
            color: white; 
            border: none; 
            padding: 5px 10px; 
            border-radius: 3px; 
            cursor: pointer;
        }
        #processOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>
    <div id="processOverlay"></div>
    <div id="processWindow">
        <button id="closeProcessWindow">×</button>
        <h3>Process Status</h3>
        <div id="processContent"></div>
        <div id="processProgress">
            <div id="processProgressBar"></div>
        </div>
        <div id="processStatus">Ready to start...</div>
    </div>

    <h1>Browser-Based Fraud Detection Demo</h1>
    <p>Upload a CSV file with columns: step, amount, oldbalanceOrg, newbalanceOrig, oldbalanceDest, newbalanceDest, isFraud</p>
    
    <div class="container">
        <div class="panel">
            <h3>Data Input & Training</h3>
            <input type="file" id="csvFile" accept=".csv">
            <div>
                <button id="loadData">Load & Preprocess Data</button>
                <button id="trainModel">Train Model</button>
                <button id="evaluateModel">Evaluate Model</button>
            </div>
            <div id="dataInfo"></div>
            <div id="trainingProgress">
                <h4>Training Progress</h4>
                <div id="progressLog"></div>
            </div>
        </div>
        
        <div class="panel">
            <h3>Results & Visualization</h3>
            <div id="modelInfo"></div>
            <div id="evaluationResults"></div>
            <canvas id="resultsCanvas"></canvas>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
