<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fraud Detection App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Fraud Detection (GRU + TensorFlow)</h1>
  <p>Enter transaction details:</p>

  <div class="form">
    <input id="step" type="number" placeholder="Step (hour)" />
    <input id="amount" type="number" placeholder="Amount" />
    <input id="oldbalanceOrg" type="number" placeholder="Old Balance Origin" />
    <input id="newbalanceOrig" type="number" placeholder="New Balance Origin" />
    <input id="oldbalanceDest" type="number" placeholder="Old Balance Dest" />
    <input id="newbalanceDest" type="number" placeholder="New Balance Dest" />
    <select id="type">
      <option value="0">CASH_OUT</option>
      <option value="1">TRANSFER</option>
    </select>
    <button onclick="checkFraud()">Check Fraud</button>
  </div>

  <p id="result"></p>

  <script>
    async function checkFraud() {
      const features = [
        parseFloat(document.getElementById('step').value),
        parseFloat(document.getElementById('amount').value),
        parseFloat(document.getElementById('oldbalanceOrg').value),
        parseFloat(document.getElementById('newbalanceOrig').value),
        parseFloat(document.getElementById('oldbalanceDest').value),
        parseFloat(document.getElementById('newbalanceDest').value),
        parseInt(document.getElementById('type').value)
      ];

      const res = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ features })
      });

      const data = await res.json();
      if (data.error) {
        document.getElementById("result").innerText = `Error: ${data.error}`;
      } else {
        const prob = (data.fraud_probability * 100).toFixed(2);
        document.getElementById("result").innerText = `Fraud Probability: ${prob}%`;
      }
    }
  </script>
</body>
</html>
