<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CNN + GRU Stock Prediction Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; background:#0e1218; color:#e9eef3; margin:0; }
    .wrap { max-width:1100px; margin:auto; padding:20px; }
    h1 { margin-bottom:12px; }
    button { padding:8px 14px; border:none; border-radius:8px; cursor:pointer; font-weight:600; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    input[type=file]{color:#ccc;}
    progress { width:100%; height:10px; }
    .grid { display:grid; grid-template-columns:1fr; gap:16px; }
    @media(min-width:900px){.grid{grid-template-columns:1fr 1fr;}}
    .panel { background:#171e27; border-radius:12px; padding:16px; box-shadow:0 4px 20px rgba(0,0,0,.4); }
    canvas { max-width:100%; }
    .stock-chart { margin-top:10px; background:#1d2632; padding:10px; border-radius:10px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>📈 Hybrid CNN + GRU Stock Prediction Demo</h1>
  <div class="panel">
    <input type="file" id="csvFile" accept=".csv" />
    <button id="trainBtn" disabled>Train Model</button>
    <button id="predictBtn" disabled>Run Prediction</button>
    <p id="status">Upload CSV file to begin (training uses 12 days of Open/Close)</p>
    <progress id="trainingProgress" value="0" max="100"></progress>
  </div>

  <div class="grid">
    <div class="panel">
      <h3>Accuracy by Stock</h3>
      <canvas id="accuracyChart" height="300"></canvas>
    </div>
    <div class="panel">
      <h3>Prediction Timelines (Top 3)</h3>
      <div id="timelineContainer"></div>
    </div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
