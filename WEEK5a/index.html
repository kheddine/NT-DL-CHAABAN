<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hybrid RNN + GRU Stock Prediction (TF.js)</title>
  <!-- Load libraries BEFORE modules so global tf/Chart exist -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0b0f14; --fg:#e9eef3; --muted:#9fb0c0; --card:#141a22; --accent:#6be4c1; --warn:#ff9c7b; --bad:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--fg); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 16px; font-weight: 700; }
    .panel { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    input[type="file"] { color: var(--muted); }
    button { background: var(--accent); color: #04151e; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    progress { width: 100%; height: 10px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
    .stock-chart { background: var(--card); border-radius: 12px; padding: 12px; }
    .muted { color: var(--muted); }
    canvas { max-width: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📈 Hybrid RNN + GRU Stock Prediction (TensorFlow.js)</h1>

    <div class="panel">
      <div class="row">
        <input type="file" id="csvFile" accept=".csv" />
        <button id="trainBtn" disabled>Train Model</button>
        <button id="predictBtn" disabled>Run Prediction</button>
      </div>
      <p id="status" class="muted">Waiting for CSV…</p>
      <progress id="trainingProgress" value="0" max="100"></progress>
    </div>

    <div class="grid">
      <div class="panel">
        <h3>Stock Accuracy Ranking</h3>
        <canvas id="accuracyChart" height="300"></canvas>
      </div>
      <div class="panel">
        <h3>Prediction Timelines (Top 3)</h3>
        <div id="timelineContainer"></div>
      </div>
    </div>
  </div>

  <!-- App modules -->
  <script type="module" src="./app.js"></script>
</body>
</html>
