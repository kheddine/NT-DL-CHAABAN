<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client-Side Stock Prediction Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background-color: #111;
      color: #f5f5f5;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: flex-start;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 2vw + 1rem, 2.5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    input[type="file"],
    button {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 0.5rem;
      padding: 0.65rem 1rem;
      color: inherit;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    input[type="file"]:hover,
    button:hover {
      border-color: #3aa0ff;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      min-height: 1.5rem;
      margin: 0;
      font-size: 0.95rem;
      color: #a0c4ff;
    }

    progress {
      width: min(320px, 100%);
      height: 0.75rem;
      border-radius: 999px;
      overflow: hidden;
      background: #1d1d1d;
    }

    progress::-webkit-progress-bar {
      background: #1d1d1d;
    }

    progress::-webkit-progress-value {
      background: linear-gradient(90deg, #3aa0ff, #8d6bff);
    }

    main {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      flex: 1;
    }

    section {
      background: #161616;
      border: 1px solid #232323;
      border-radius: 0.9rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
    }

    canvas {
      width: 100%;
      aspect-ratio: 16 / 10;
    }

    #timelineContainer {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Client-Side S&amp;P 500 Movement Predictor</h1>
    <div class="controls">
      <label for="csvFile">Upload CSV:</label>
      <input id="csvFile" type="file" accept=".csv" />
      <button id="trainBtn" disabled>Train Model</button>
      <button id="predictBtn" disabled>Generate Predictions</button>
    </div>
    <p id="status">Load a CSV file to begin.</p>
    <progress id="trainingProgress" value="0" max="1"></progress>
  </header>

  <main>
    <section>
      <h2>Stock Accuracy</h2>
      <canvas id="accuracyChart" aria-label="Per-stock accuracy chart" role="img"></canvas>
    </section>
    <section>
      <h2>Prediction Timeline</h2>
      <div id="timelineContainer">
        <canvas id="timelineChart" aria-label="Prediction correctness timeline" role="img"></canvas>
      </div>
    </section>
  </main>

  <footer>
    All computation happens locally in your browser using TensorFlow.js.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
