<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Prediction Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #4a90e2;
            --card-bg: #2d2d2d;
            --border-color: #404040;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        
        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover:not(:disabled) {
            background: #357abd;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        input[type="file"] {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-color);
            color: var(--text-color);
        }
        
        .progress-container {
            margin: 15px 0;
        }
        
        progress {
            width: 100%;
            height: 20px;
        }
        
        #status {
            padding: 10px;
            background: var(--card-bg);
            border-radius: 4px;
            border-left: 4px solid var(--accent-color);
            margin: 10px 0;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .chart-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        canvas {
            max-width: 100%;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Stock Prediction Demo</h1>
            <p>Hybrid RNN + GRU Model for Stock Movement Prediction</p>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <input type="file" id="csvFile" accept=".csv">
                <button id="trainBtn" disabled>Train Model</button>
                <button id="predictBtn" disabled>Make Predictions</button>
            </div>
            
            <div class="progress-container">
                <progress id="trainingProgress" value="0" max="100" class="hidden"></progress>
            </div>
            
            <div id="status">Please upload a CSV file to begin</div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-container">
                <h3>Stock Prediction Accuracy</h3>
                <canvas id="accuracyChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Prediction Timeline</h3>
                <canvas id="timelineChart"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="./data-loader.js"></script>
    <script type="module" src="./rnn_gru.js"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
