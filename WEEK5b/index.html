<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CNN + GRU Stock Prediction (12 days, Open/Close)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#0c1118; --card:#151b24; --fg:#e8edf3; --muted:#98a6b3; --accent:#6be4c1; --warn:#ff9c7b; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{max-width:1100px;margin:0 auto;padding:22px}
    h1{margin:0 0 12px}
    .panel{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input[type=file]{color:var(--muted)}
    button{background:var(--accent);color:#04151e;border:none;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    progress{width:100%;height:10px}
    .grid{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
    canvas{max-width:100%}
    .stock-chart{background:#1a2230;border-radius:10px;padding:10px;margin-top:8px}
    .muted{color:var(--muted)}
    a{color:#a8e6ff}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📈 CNN + GRU Stock Direction (12 days, Open/Close)</h1>

    <div class="panel">
      <div class="row">
        <input type="file" id="csvFile" accept=".csv" />
        <button id="trainBtn" disabled>Train Model</button>
        <button id="predictBtn" disabled>Run Prediction</button>
      </div>
      <p id="status" class="muted">Upload a CSV with columns: Date, Symbol, Open, Close</p>
      <progress id="trainingProgress" value="0" max="100"></progress>
    </div>

    <div class="grid">
      <div class="panel">
        <h3>Accuracy by Stock</h3>
        <canvas id="accuracyChart" height="320"></canvas>
      </div>
      <div class="panel">
        <h3>Prediction Timelines (Top 3)</h3>
        <div id="timelineContainer"></div>
      </div>
    </div>
  </div>

  <!-- App modules -->
  <script type="module" src="./app.js"></script>
</body>
</html>
