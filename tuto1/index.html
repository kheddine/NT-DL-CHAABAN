<!DOCTYPE html>
<html>
<head>
    <title>Model Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
</head>
<body>
    <h1>Model Test</h1>
    <div id="status">Testing...</div>
    <script>
        async function testModel() {
            try {
                await tf.ready();
                document.getElementById('status').textContent = 'TF.js loaded. Loading model...';
                
                const model = await tf.loadLayersModel('./model/model.json');
                document.getElementById('status').textContent = 'Model loaded! Testing prediction...';
                
                // Test with dummy data
                const testInput = tf.ones([1, 150, 150, 3]);
                const prediction = model.predict(testInput);
                const result = await prediction.data();
                
                document.getElementById('status').textContent = 
                    `SUCCESS! Model works. Output: ${Array.from(result)}`;
                
            } catch (error) {
                document.getElementById('status').textContent = 
                    `ERROR: ${error.message}`;
            }
        }
        testModel();
    </script>
</body>
</html>
