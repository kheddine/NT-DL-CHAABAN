<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Classifier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rock Paper Scissors Classifier</h1>
            <p>Show your hand to the camera to classify rock, paper, or scissors</p>
        </header>

        <main>
            <section class="video-section">
                <div class="video-container">
                    <video id="video" width="640" height="480" autoplay playsinline></video>
                    <canvas id="canvas" width="224" height="224"></canvas>
                </div>
            </section>

            <section class="controls-section">
                <div class="button-group">
                    <button id="startBtn" class="btn btn-primary">Start Camera</button>
                    <button id="classifyBtn" class="btn btn-success" disabled>Start Classification</button>
                    <button id="stopBtn" class="btn btn-danger" disabled>Stop Classification</button>
                </div>
            </section>

            <section class="results-section">
                <div id="result" class="result-box">Loading model...</div>
                <div id="confidence" class="confidence-container"></div>
                <div id="status" class="status-box">Ready to start</div>
            </section>
        </main>

        <footer>
            <p>Built with TensorFlow.js</p>
        </footer>
    </div>

    <!-- Load TensorFlow.js from official CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
