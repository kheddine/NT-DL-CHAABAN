<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Demand Forecasting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">🛍️ Retail Demand Forecasting</h1>
        
        <!-- Step 1: Data Loading -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h5 mb-0">1. Load Dataset</h2>
            </div>
            <div class="card-body">
                <input type="file" id="csvFile" class="form-control mb-3" accept=".csv">
                <button id="loadData" class="btn btn-primary" disabled>Process Data</button>
                <div id="dataInfo" class="mt-3"></div>
            </div>
        </div>

        <!-- Step 2: Model Training -->
        <div class="card mb-4">
            <div class="card-header bg-success text-white">
                <h2 class="h5 mb-0">2. Train GRU Model</h2>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label for="epochs" class="form-label">Epochs</label>
                        <input type="number" id="epochs" class="form-control" value="50" min="1">
                    </div>
                    <div class="col-md-3">
                        <label for="batchSize" class="form-label">Batch Size</label>
                        <input type="number" id="batchSize" class="form-control" value="32" min="1">
                    </div>
                    <div class="col-md-3">
                        <label for="learningRate" class="form-label">Learning Rate</label>
                        <input type="number" id="learningRate" class="form-control" value="0.001" step="0.0001">
                    </div>
                </div>
                <button id="trainModel" class="btn btn-success" disabled>Train Model</button>
                <div id="trainingProgress" class="mt-3"></div>
            </div>
        </div>

        <!-- Step 3: Results Dashboard -->
        <div class="card">
            <div class="card-header bg-info text-white">
                <h2 class="h5 mb-0">3. Forecast Dashboard</h2>
            </div>
            <div class="card-body">
                <!-- Global Metrics -->
                <div id="globalMetrics" class="row mb-4"></div>
                
                <!-- Product Selection -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="productSelect" class="form-label">Select Product</label>
                        <select id="productSelect" class="form-select" disabled>
                            <option value="">Select a product...</option>
                        </select>
                    </div>
                </div>

                <!-- Charts -->
                <div class="row">
                    <div class="col-lg-6 mb-4">
                        <div class="card">
                            <div class="card-header">Accuracy Ranking (MAPE % - Lower is Better)</div>
                            <div class="card-body">
                                <canvas id="accuracyChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 mb-4">
                        <div class="card">
                            <div class="card-header">7-Day Forecast</div>
                            <div class="card-body">
                                <canvas id="forecastChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Forecast Table -->
                <div class="card mb-4">
                    <div class="card-header">Detailed Forecast</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table id="forecastTable" class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Day</th>
                                        <th>Actual</th>
                                        <th>Predicted</th>
                                        <th>Error</th>
                                        <th>Error %</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <button id="downloadResults" class="btn btn-outline-primary" disabled>Download Forecasts as CSV</button>
            </div>
        </div>
    </div>

    <script type="module" src="data-loader.js"></script>
    <script type="module" src="gru.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
