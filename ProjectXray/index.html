<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Demand Forecasting</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .progress { height: 20px; background: #f0f0f0; border-radius: 10px; margin: 10px 0; }
        .progress-bar { height: 100%; background: #4CAF50; border-radius: 10px; width: 0%; transition: width 0.3s; }
        .charts { display: flex; flex-wrap: wrap; gap: 20px; }
        .chart-container { flex: 1; min-width: 300px; height: 300px; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 20px 0; }
        .metric-card { padding: 15px; background: #f8f9fa; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Retail Demand Forecasting</h1>
        
        <div class="section">
            <h2>1. Load Dataset</h2>
            <input type="file" id="csvFile" accept=".csv">
            <button id="loadData">Load & Preprocess Data</button>
            <div id="dataInfo"></div>
        </div>

        <div class="section">
            <h2>2. Model Configuration</h2>
            <div>
                <label>Product/Warehouse: </label>
                <select id="entitySelect"></select>
                <button id="trainModel">Train Model</button>
                <button id="loadModel" disabled>Load Saved Model</button>
            </div>
            <div class="progress">
                <div class="progress-bar" id="trainingProgress"></div>
            </div>
            <div id="trainingLog"></div>
        </div>

        <div class="section">
            <h2>3. Forecast Results</h2>
            <div id="metrics" class="metrics"></div>
            <div class="charts">
                <div class="chart-container">
                    <canvas id="forecastChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="accuracyChart"></canvas>
                </div>
            </div>
            <div id="forecastResults"></div>
        </div>
    </div>

    <script type="module" src="data-loader.js"></script>
    <script type="module" src="gru.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
