<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Admissions Assistant</title>
    
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Minimalist white page */
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #eee; font-size: 3rem; }
    </style>
</head>
<body>

    <h1>HSE PORTAL</h1>

    <script type="module">
        import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

        createChat({
            webhookUrl: 'http://localhost:5678/webhook/423cc0f7-218b-4691-9140-a36fc740bb79/chat',
            mode: 'window', // This creates the "pop-out" bubble
            showWelcomeScreen: true,
            title: 'HSE Admissions Bot',
            subtitle: 'Ask about Moscow campus programs',
            mainColor: '#0055A4', // HSE Blue
            launcherColor: '#0055A4'
        });
    </script>
</body>
</html>
