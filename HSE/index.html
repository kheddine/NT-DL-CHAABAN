<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Admissions Assistant</title>
    
    <script src="https://cdn.botpress.cloud/webchat/v2.2/shareable.js"></script>
    
    <script src="https://files.bpcontent.cloud/2026/02/26/20/20260226204552-HV8SP4LU.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #eeeeee; font-size: 3rem; letter-spacing: 5px; }

        /* Force the bot to the Bottom Left */
        #bp-webchat-container, .bpw-floating-button {
            left: 20px !important;
            right: auto !important;
        }
    </style>
</head>
<body>

    <h1>HSE PORTAL</h1>

    <script>
        // Latest 2026 method to check if the bot is stuck
        window.botpressWebChat.onEvent(function (event) {
            if (event.type === 'LIFECYCLE.LOADED') {
                console.log("HSE Bot is now live.");
            }
        }, ['LIFECYCLE.LOADED']);
    </script>
</body>
</html>
